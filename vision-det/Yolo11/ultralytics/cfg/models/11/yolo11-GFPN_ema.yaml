# YOLOv8 object detection model with P2-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512] 
  x: [1.00, 1.50, 512] 

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 3, C3k2_StarGate, [128, True]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, C3k2_EMA, [256, True]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 6, C3k2_EMA, [512, True]]     # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 3, C3k2_EMA, [1024, True]]    # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9
  - [-1, 3, C2PSA, [1024]]             # 10 (backbone last)

head:
  - [-1, 1, Conv, [512, 1, 1]]         # 11: from backbone 10 (P5)

  - [6, 1, Conv, [512, 3, 2]]          # 12: from backbone 6 (P4 -> down to P5 size)
  - [[-1, 10], 1, Concat, [1]]         # 13: head12 + backbone10 (둘 다 P5 해상도)
  - [-1, 3, C3k2_EMA, [512]]           # 14: P5 fused/refined

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 15: P5 -> P4 해상도
  - [4, 1, Conv, [256, 3, 2]]                    # 16: backbone4 (P3 -> down to P4 해상도)
  - [[-1, 16, 6], 1, Concat, [1]]                # 17: (P4) upsampled + downsampled(P3) + backbone6(P4)
  - [-1, 3, C3k2_EMA, [512]]                     # 18: P4 refined

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 19: P4 -> P3 해상도
  - [[-1, 4], 1, Concat, [1]]                    # 20: (P3) + backbone4(P3)
  - [-1, 3, C3k2_EMA, [256]]                     # 21: P3 refined

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 22: P3 -> P2 해상도
  - [[-1, 2], 1, Concat, [1]]                    # 23: (P2) + backbone2(P2)
  - [-1, 3, C3k2_EMA, [128]]                     # 24: P2 final

  - [-1, 1, Conv, [128, 3, 2]]                   # 25: P2 -> P3 down
  - [[-1, 21], 1, Concat, [1]]                   # 26: (P3) + P3 refined
  - [-1, 3, C3k2_EMA, [256]]                     # 27: P3 final

  - [-1, 1, Conv, [256, 3, 2]]                   # 28: P3 -> P4 down
  - [[-1, 18], 1, Concat, [1]]                   # 29: (P4) + P4 refined
  - [-1, 3, C3k2_EMA, [512]]                     # 30: P4 final

  # P5 최종 결합 (원래 당신 구조처럼 3개를 P5 해상도로 맞춰 concat)
  - [18, 1, Conv, [256, 3, 2]]                   # 31: P4 refined(40)->P5(20)
  - [30, 1, Conv, [256, 3, 2]]                   # 32: P4 final(40)->P5(20)
  - [[13, 31, 32], 1, Concat, [1]]               # 33: 모두 P5 해상도
  - [-1, 3, C3k2_EMA, [1024]]                    # 34: P5 final

  - [[24, 27, 30, 34], 1, Detect, [nc]]          # 35: P2,P3,P4,P5

