# YOLO11s StarGate + EMA (P6) - Efficient design (<=20M params, <=30 GFLOPs target)
# - Backbone: StarGate blocks on deeper stages (P4~P6) from yolo11_star_p6_layer반복.yaml
# - Neck/Head: EMA-embedded C3k2 blocks (C3k2_EMA) inspired by yolo11-GFPN_ema_baseline.yaml
#
# Note: Update `nc` to your dataset classes.

author: hsjeong + ChatGPT
task: detect
keywords: [yolo11, stargate, ema, p6, efficient]
description: YOLO11s-based detector with StarGate backbone and EMA-enhanced neck, keeping compute under 30 GFLOPs and params under 20M (expected).

# Model
nc: 80
strides: [8, 16, 32, 64]

# compound scaling constants
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  # Stem
  - [-1, 1, Conv, [64, 3, 2]]

  # P2
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]

  # P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 3, C3k2, [512, False, 0.25]]

  # P4 (StarGate)
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 3, C3k2_StarGate, [768, True]]

  # P5 (StarGate)
  - [-1, 1, Conv, [768, 3, 2]]
  - [-1, 3, C3k2_StarGate, [768, True]]

  # P6 (StarGate + SPPF + PSA)
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C3k2_StarGate, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  # Top-Down Path (FPN)
  # P5 Head (20x20) - EMA-enhanced
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2_EMA, [768]]

  # P4 Head (40x40) - EMA-enhanced
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2_EMA, [512]]

  # P3 Head (80x80) - keep lightweight (no EMA), lower expansion
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False, 0.25]]

  # Bottom-Up Path (PAN)
  # P4 (40x40) - EMA-enhanced
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2_EMA, [512]]

  # P5 (20x20) - EMA-enhanced
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2_EMA, [768]]

  # P6 (10x10) - EMA-enhanced (cheap at low spatial size)
  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2_EMA, [1024]]

  # Detect Head (P3, P4, P5, P6)
  - [[21, 24, 27, 30], 1, Detect, [nc]]
